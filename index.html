<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="dist/style.css">
</head>

<body>

    <div id="title-container">
    <h1>To-Do List</h1>
    </div>  

    <label for="task-textbox">New Task:</label>
    <input type="text" id="task-textbox" value="Complete JavaScript lab">
    <button id="add-btn">Add</button>

    <ol id="task-list">
        <li>
            <span class="task-text">Clean bathroom</span>
            <button class="done-btn">×</button>
        </li>
        <li>
            <span class="task-text">Study for big exam</span>
            <button class="done-btn">×</button>
        </li>
        <li>
            <span class="task-text">Feed fish</span>
            <button class="done-btn">×</button>
        </li>
    </ol>

    <script src="dist/script.js"></script>

</body>
</html>
