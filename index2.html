
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 5px;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 22px 0;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        input {
            width: 170px;
            padding: 2px;
            font-size: 13px;
        }

        button {
            cursor: pointer;
            padding: 2px 8px;
        }

        ol {
            padding-left: 40px;
            margin-top: 16px;
        }

        li {
            padding: 5px 0;
            width: 240px;
        }

        .delete {
            float: right;
            border: none;
            background: none;
            color: #888;
            font-size: 18px;
            padding: 0 3px;
            line-height: 18px;
        }

        .delete:hover {
            color: red;
        }
    </style>
</head>

<body>

    <h1>To-Do List</h1>

    <div class="input-area">
        <label for="taskInput">New task:</label>
        <input type="text" id="taskInput"
               value="Complete JavaScript lab">
        <button onclick="addTask()">Add</button>
    </div>

    <ol id="taskList">
        <li>
            Clean bathroom
            <button class="delete" onclick="deleteTask(this)">×</button>
        </li>
        <li>
            Study for big exam
            <button class="delete" onclick="deleteTask(this)">×</button>
        </li>
        <li>
            Feed fish
            <button class="delete" onclick="deleteTask(this)">×</button>
        </li>
    </ol>

</body>
</html>
